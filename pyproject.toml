[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lode-code-search"
version = "0.1.1"
description = "Semantic + keyword search over your codebases, as one small binary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lode contributors" }]
keywords = ["code-search", "semantic-search", "bm25", "embeddings", "cli", "index"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pathspec>=0.12",
  "numpy>=1.26",
  "fastembed>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/yashneil75/lode"
Repository = "https://github.com/yashneil75/lode"
Issues = "https://github.com/yashneil75/lode/issues"

[project.scripts]
lode = "lode.cli:main"

[project.optional-dependencies]
dev = ["pyinstaller>=6.10", "pytest>=8.2", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/lode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
